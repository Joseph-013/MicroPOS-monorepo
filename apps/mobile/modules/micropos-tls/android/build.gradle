plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.micropostls'
version = '0.1.0'

android {
  namespace "expo.modules.micropostls"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  // The same OkHttp the React Native networking and WebSocket modules use.
  implementation 'com.squareup.okhttp3:okhttp:4.9.2'
}
